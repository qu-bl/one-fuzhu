name: Public contract release

on:
  pull_request:
    paths:
      - 'contracts/schema-v3/**'
      - 'ai-rules/**'
      - 'rive-editor/**'
      - 'tools/*translation*'
      - '.github/workflows/contract-release.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/schema-v3/**'
      - 'ai-rules/**'
      - 'rive-editor/**'
      - 'tools/*translation*'
      - '.github/workflows/contract-release.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r contracts/schema-v3/requirements.txt
      - run: python contracts/schema-v3/release.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix contracts/schema-v3/inspection
      - run: node contracts/schema-v3/inspection/build.mjs --check
      - run: npm test --prefix contracts/schema-v3/inspection
      - run: node tools/test-translation.mjs
